<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter</title>
</head>
<body>
    <script>
        let count = 0;
        setInterval(
            function(){
                document.title = count;
                document.write(`<h4 style="padding:0;margin:0;border:4px double red;width:25px;text-align:center;"> ${count}</h4>`);
                
                count+=1;
            },1000)
        

    </script>
</body>
</html>
