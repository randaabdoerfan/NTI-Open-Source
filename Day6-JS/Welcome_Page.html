<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome Page</title>
</head>

<body>
    <script>

        let i = 0;
        setInterval(() => {
            let text = "welcome to js".split("");
            document.write(text[i])
            i += 1
            if (i == text.length) {
                window.close()
            }
        }, 1000);



    </script>

</body>

</html>
