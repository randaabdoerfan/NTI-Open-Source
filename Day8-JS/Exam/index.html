<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JS Exam System</title>

    <link rel="stylesheet" href="style.css" />

</head>

<body>

    <div class="container">
        <div class="exam-card">
            <h1>JS Exam System</h1>
            <p id="progress"></p>
            <h2 id="question"></h2>
            <input type="text" id="answer" placeholder="Type your answer" />
            <div class="buttons">
                <button id="prev">Previous</button>
                <button id="next">Next</button>
            </div>
        </div>
        <div id="result"></div>
        <button id="restart">Restart Exam</button>
    </div>
    <script type="module" src="app.js"></script>

</body>

</html>
