    <script>
    
function Chunk(arr, num) {
    let copy = [...arr];
    let result = [];

    while (copy.length > 0) {
        let new_array = [];

        if (copy.length >= num) {
            for (let j = 0; j < num;j++) {
                new_array.push(copy[0]);
                copy.splice(0, 1);       
            }
        } else { 
            for (let i = 0; i < copy.length; i++) {
                new_array.push(copy[0]);
                copy.splice(0, 1);
            }
        }
        result.push(new_array);
    }

    return result;
}

console.log(Chunk([1,2,3,4,5,6,7], 3));

    </script>
