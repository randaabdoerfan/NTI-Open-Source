<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="style.css">
    <style>
        div {
            margin-bottom: 200px;
            z-index: -20;
        }

        .contact {
            position: relative;
            margin-top: 150px;
            text-align: center;
        }

        p {
            font-size: 14px;
        }

        input {
            width: 80%;
            height: 30px;
            font-size: 16px;
        }

        textarea {
            width: 80%;
            height: 80px;
            font-size: 16px;
        }

        h2 {
            font-size: 20px;
            font-weight: 300;
        }

        .side {
            text-align: center;
            width: 200px;
            padding: 5px;
            border-radius: 10px;
            background-color: rgb(179, 213, 215);
            vertical-align: top;

        }

        span {
            padding: 3px 15px;
            color: rgb(226, 65, 92);
            border: 2px solid rgb(226, 65, 92);
            border-radius: 7px;

        }

        span:hover {
            background-color: rgb(179, 187, 35);
            border: 2px solid rgb(179, 187, 35);
            color: white;
            cursor: pointer;
        }

        .but {
            background-color: rgb(226, 65, 92);
            color: white;
            border: 2px solid rgb(226, 65, 92);
        }

        .but:hover {
            background-color: rgb(179, 187, 35);
            cursor: pointer;
            color: white;
            border: 2px solid rgb(179, 187, 35);

        }

        footer {
            width: 100%;
            background-color: rgb(226, 65, 92);
            position: relative;
            bottom: 0px;
            height: 130px;
            text-align: center;
        }

        .footer {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }
    </style>
</head>

<body>
    <header>
        <ul>
            <li>
                <img src="./images/logo.png" alt="logo">
            </li>
            <li class="home"><a href="Home.html">HOME</a></li>
            <li><a href="About.html">ABOUT</a><br><a class="hidden" href="Products.html">PRODUCTS</a></li>
            <li><a href="Blog.html">BLOG</a><br><a class="hidden" href="Post.html">SINGLE POST</a></li>
            <li><a href="Contact.html">CONTACT</a></li>


        </ul>

    </header>
    <h1>CONTACT</h1>
    <div>

        <table class="contact">

            <tr>
                <td>
                    <table>
                        <tr>
                            <td>
                                <h2>INQERY FORM</h2>
                            </td>
                        </tr>
                        <tr>
                            <td>
                                <input type="text" placeholder="Name">
                            </td>
                        </tr>
                        <tr>
                            <td>
                                <input type="email" placeholder="Email">
                            </td>
                        </tr>
                        <tr>
                            <td>
                                <input type="text" placeholder="Subject">
                            </td>
                        </tr>
                        <tr>
                            <td>
                                <textarea placeholder="Share your thoughts"></textarea>
                            </td>
                        </tr>
                        <tr>
                            <td>
                                <input class="but" type="submit" value="Send">
                            </td>
                        </tr>
                    </table>
                </td>
                <td>
                    <div class="side">
                        <h2>WE'D LOVE TO HEAR FROM YOU</h2>
                        <p>If you're having problems editing this website template,
                            then don't hesitate to ask for help on the Forums</p>
                    </div>

                </td>
            </tr>
        </table>
    </div>
    <footer>
        <table>
            <tr class="footer">
                <td><img src="./images/face.png" alt=""></td>
                <td><img src="./images/tiwter.JPG" alt=""></td>
                <td><img src="./images/google.JPG" alt=""></td>
                <td><img src="./images/pin.JPG" alt=""></td>


            </tr>
            <tr class="footer">
                <td>
                    <p>&copy;2023 Freeze all rights are reseved.</p>
                </td>
            </tr>
        </table>

    </footer>


</body>

</html>
