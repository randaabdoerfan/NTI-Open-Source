<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task1</title>
</head>

<body>
    <script>
        var sentence = prompt("Please Enter Sentence..")
        if (sentence.trim() === "") {
            console.log("Please enter String, Don't leave it EMPTY");

        } else if (!isNaN(sentence)) {
            console.log("Please enter text, not NUMBER");

        } 
        else if (sentence.includes("!") ||sentence.includes("!")||sentence.includes("@")||sentence.includes("#")||sentence.includes("$")||sentence.includes("%")|| sentence.includes("^")||sentence.includes("&")||sentence.includes("*")||sentence.includes("(")||sentence.includes(")")) {
            console.log("Please enter text, not SPECIAL CHARACTER");

        } else {
            sentence = sentence.trim().toLowerCase();
            console.log(`Before : ${sentence}`);
            var new_sentence = sentence.valueOf().split(" ");

            var final_result = new String("");
            for (var i = 0; i < new_sentence.length; i++) {
                final_result += new_sentence[i][0].valueOf().toUpperCase() + new_sentence[i].slice(1, new_sentence[i].length) + " ";
            }
            console.log(`After : ${final_result}`)
        }

    </script>

</body>

</html>
